name: IndexNow

# Déclenché par Vercel : à chaque mise en production réussie, l'intégration
# GitHub de Vercel pose un statut de déploiement « success » sur l'environnement
# « Production ». On lit alors le sitemap en ligne et on soumet à IndexNow les
# URLs nouvelles / modifiées / disparues depuis la dernière exécution.
#
# Lancement manuel possible depuis l'onglet Actions (mode « changed » ou « all »).
# Aucun secret requis : la clé IndexNow est publique (public/<clé>.txt).

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      mode:
        description: "URLs à soumettre"
        type: choice
        options:
          - changed
          - all
        default: changed

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.deployment_status.state == 'success' &&
        (
          startsWith(github.event.deployment.environment, 'Production') ||
          github.event.deployment.production_environment == true
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt (pour le script et la clé)
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Mémorise url → lastmod entre deux exécutions (évite de resoumettre
      # l'inchangé). Sans cache (1re fois ou cache expiré), le script retombe
      # sur « lastmod dans les 30 derniers jours ».
      - name: Restaurer l'état de la dernière exécution
        uses: actions/cache@v4
        with:
          path: .indexnow
          key: indexnow-state-${{ github.run_id }}
          restore-keys: indexnow-state-

      - name: Laisser le CDN servir le nouveau sitemap
        if: github.event_name == 'deployment_status'
        run: sleep 20

      - name: Soumettre à IndexNow
        env:
          SITE_URL: https://www.astro-cours.com
        run: node scripts/indexnow.mjs ${{ inputs.mode == 'all' && '--all' || '' }}
